name: Django CI

on: [push]

jobs:
  build:

    runs-on: ubuntu-latest

    env:
      SECRET_KEY: 'ci-only-not-a-real-secret-key-for-testing'
      DEBUG: 'True'
      ALLOWED_HOSTS: localhost
      DB_HOST: localhost
      DB_NAME: InterviewCode
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_PORT: 5432
      REDIS_HOST: localhost

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: InterviewCode
          POSTGRES_USER: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    defaults:
      run:
        working-directory: ./InterviewCode

    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: InterviewCode/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint code with ruff
        run:
          ruff check --output-format=github

      - name: Check code formatting with ruff
        run:
          ruff format --diff
        continue-on-error: True

      - name: Run tests
        run:
          python manage.py test
