{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <meta charset="UTF-8">
  <title>Комната</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0d1117; color: #e6edf3;
      min-height: 100vh; display: flex; justify-content: center; padding: 40px 16px;
    }
    .container { width: 100%; max-width: 640px; }
    h1 { font-size: 24px; margin-bottom: 4px; }
    .muted { color: #8b949e; font-size: 14px; margin-bottom: 24px; }
 
    .card {
      background: #161b22; border: 1px solid #30363d;
      border-radius: 10px; padding: 20px; margin-bottom: 16px;
    }
    input {
      width: 100%; padding: 10px 12px; margin-bottom: 10px;
      background: #0d1117; border: 1px solid #30363d; border-radius: 6px;
      color: #e6edf3; font-size: 14px;
    }
    input:focus { outline: none; border-color: #58a6ff; }
 
    button {
      padding: 10px 16px; border: none; border-radius: 6px;
      background: #238636; color: #fff; font-size: 14px; cursor: pointer;
    }
    button:hover { background: #2ea043; }
    button.secondary { background: #21262d; border: 1px solid #30363d; }
    button.secondary:hover { background: #30363d; }
 
    .row { display: flex; gap: 10px; align-items: center; }
    .error { color: #f85149; font-size: 13px; margin-top: 8px; }
    .hidden { display: none; }
 
    #editor {
      height: 400px;
      border-radius: 6px;
      overflow: hidden;
    }

    .card-header {
      display: flex;
      justify-content: flex-start; 
      gap: 10px;
      align-items: center;            
      margin-bottom: 12px;
    }

    .card-header button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 30px;
      height: 30px;
      padding: 0;
    }

    #output {
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 12px;
      font-family: 'Consolas', 'Monaco', monospace;
      font-size: 13px;
      color: #e6edf3;
      height: 150px;
      overflow-y: auto;      
      white-space: pre-wrap;  
      word-break: break-all;
    }

  </style>
</head>
 
<body>
    <div class="container">
        <h1>Комната</h1>
        <p class="muted">UUID : <span id="roomUuid"></span></p>
 
        <div class="card">
            <div class="card-header">
              <h3>Код</h3>
              <button id="btn-stop" onclick="stop_button()" title="Остановить"><img src="/static/mysite/icons/stop-button.svg" alt="Запустить"></button>
              <button id="btn-run" onclick="run_button()" title="Запустить">
                <i class="fa-solid fa-play"></i>
              </button>
            </div>
            <div id="editor"></div>
            <pre id="output">Здесь будет вывод программы...</pre>
        </div>
 
        <div class="card">
            <button onclick="finishRoom()">Завершить собеседование</button>
            <button class="secondary" onclick="leaveRoom()">Выйти в лобби</button>
        </div>
    </div>
 
<script type="importmap">
{
  "imports": {
    "collab-bundle": "{% static 'mysite/vendor/collab-bundle.js' %}",
    "monaco-editor/esm/vs/editor/editor.api.js": "{% static 'mysite/vendor/monaco-shim.mjs' %}"
  }
}
</script>
 
<script src="{% static 'mysite/vendor/monaco/min/vs/loader.js' %}"></script>
<script>
  require.config({ paths: { vs: "{% static 'mysite/vendor/monaco/min/vs' %}" } });
  require(['vs/editor/editor.main'], function () {
    import("{% static 'mysite/vendor/room-editor.mjs' %}").then((mod) => {
      window.__roomEditorModule = mod;
      window.__roomEditorReady = true;
    }).catch((e) => {
      console.error('Не удалось загрузить room-editor.mjs:', e);
    });
  });
</script>
 
<script>

let runWs = null;

function token() {
  return localStorage.getItem('access');
}
 
async function api(path, options = {}) {
  const API = '/api';
  const res = await fetch(API + path, {
    headers: {
      'Content-Type': 'application/json',
      ...(token() ? { Authorization: 'Bearer ' + token() } : {}),
    },
    ...options,
  });
  if (!res.ok) throw new Error((await res.json()).detail || res.statusText);
  return res.json();
}

let uuid = null;
 
async function finishRoom() {
  try {
    await api(`/rooms/${uuid}/finish/`, { method: 'POST' });
    alert('Интервью закончено');
    location.href = '/';
  } catch (e) { alert(e.message); }
}
 
function leaveRoom() {
  location.href = '/';
}
 
async function init() {
  if (!token()) {
    sessionStorage.setItem('redirect_after_login', location.pathname);
    location.href = 'register/';
    return;
  }
 
  uuid = location.pathname.split('/').filter(Boolean).pop();

  if (!uuid) {
    alert('Не указан uuid комнаты');
    location.href = '/';
    return;
  }
 
  document.getElementById('roomUuid').textContent = uuid;
 
  try {
    await api(`/rooms/${uuid}/join/`, { method: 'POST' });

    const wsToken = token();
    const protocol = location.protocol === 'https:' ? 'wss' : 'ws';
    runWs = new WebSocket(`${protocol}://${location.host}/ws/run/${uuid}/?token=${wsToken}`);

    runWs.onmessage = (event) => {
      let data;

      try {
        data = JSON.parse(event.data);
      } catch(e) {
        console.error("Не удалось разобрать JSON", event.data);
        return;
      }

      const output = document.getElementById("output");
      if (data.type === 'run_output'){
        output.textContent += data.data;
        output.scrollTop = output.scrollHeight;
      } else if (data.type === 'run_finished'){
        document.getElementById('btn-run').disabled = false;
      } else if (data.type === 'run_started') {
        document.getElementById('btn-run').disabled = true;
        output.textContent = '';
      }

      runWs.onclose = (event) => {
        output.textContent += "Соединение потеряно, перезагрузите страницу!";
      }
    }

    const room = await api(`/rooms/${uuid}/`);
    console.log('Комната:', room);
 
    // ждём, пока AMD Monaco + динамический импорт room-editor.mjs отработают
    while (!window.__roomEditorReady) {
      await new Promise(r => setTimeout(r, 50));
    }
    window.__roomEditorModule.initEditor(uuid);
  } catch (e) {
    alert('Ошибка: ' + e.message);
    location.href = '/';
  }
}

init();
 
function run_button(){
  if (runWs && runWs.readyState === WebSocket.OPEN){
    document.getElementById('output').textContent = '';
    runWs.send(JSON.stringify({ type: "run", code: window.__editor.getValue() }));
    runWs.send(JSON.stringify({ type: "" }))
    document.getElementById('btn-run').disabled = true;
  }
}

function stop_button(){
  if (runWs && runWs.readyState === WebSocket.OPEN){
    runWs.send(JSON.stringify({ type: "stop" }));
  }
}

</script>
</body>
</html>
